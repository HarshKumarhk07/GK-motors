<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2F8"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EDF5"/><stop offset="50%" stop-color="#C3CEDE"/><stop offset="100%" stop-color="#9AA9BF"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B4A9B"/><stop offset="100%" stop-color="#16255A"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E04A45"/><stop offset="100%" stop-color="#A81E1E"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C445"/><stop offset="100%" stop-color="#D68A16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFF1FB"/><stop offset="100%" stop-color="#A8CFE8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5568"/><stop offset="100%" stop-color="#232B3A"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <ellipse cx="300" cy="392" rx="152" ry="19" fill="#0F172A" opacity="0.10"/>
  
  <g transform="translate(300 232)">
    <!-- terminals -->
    <g>
      <rect x="-88" y="-142" width="34" height="20" rx="5" fill="#B0392C"/>
      <circle cx="-71" cy="-146" r="17" fill="#D9534F" stroke="#8F2318" stroke-width="3"/>
      <rect x="54" y="-142" width="34" height="20" rx="5" fill="#33415C"/>
      <circle cx="71" cy="-146" r="17" fill="#4A5568" stroke="#232B3A" stroke-width="3"/>
    </g>
    <!-- case -->
    <rect x="-140" y="-124" width="280" height="230" rx="14" fill="url(#dark)" stroke="#161C28" stroke-width="4"/>
    <!-- top deck -->
    <rect x="-140" y="-124" width="280" height="56" rx="14" fill="#3C4658"/>
    <rect x="-140" y="-80" width="280" height="12" fill="#2B3444"/>
    <!-- vent caps -->
    <g fill="#5A6679" stroke="#232B3A" stroke-width="2">
      <rect x="-104" y="-116" width="40" height="34" rx="6"/>
      <rect x="-52" y="-116" width="40" height="34" rx="6"/>
      <rect x="12" y="-116" width="40" height="34" rx="6"/>
      <rect x="64" y="-116" width="40" height="34" rx="6"/>
    </g>
    <!-- label -->
    <rect x="-112" y="-46" width="224" height="118" rx="8" fill="#F1F5F9"/>
    <rect x="-112" y="-46" width="224" height="36" rx="8" fill="url(#navy)"/>
    <rect x="-112" y="-22" width="224" height="12" fill="url(#navy)"/>
    <rect x="-94" y="-2" width="150" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="-94" y="20" width="112" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="-94" y="42" width="76" height="12" rx="6" fill="#E2E8F0"/>
    <!-- bolt mark -->
    <path d="M76 4 l-26 32 h18 l-8 30 30 -38 h-19 z" fill="#D68A16"/>
    <!-- carry strap -->
    <path d="M-140 -6 h-16 v58 h16" fill="none" stroke="#232B3A" stroke-width="8" stroke-linecap="round"/>
    <path d="M140 -6 h16 v58 h-16" fill="none" stroke="#232B3A" stroke-width="8" stroke-linecap="round"/>
  </g>

</svg>
