    <path d="M-118 -74 h236 l-30 148 h-176 z" fill="#E05A6B" stroke="#9B2A3B" stroke-width="4"/>
    <g stroke="#9B2A3B" stroke-width="4" opacity="0.75">
      <line x1="-100" y1="-70" x2="-88" y2="70"/>
      <line x1="-74" y1="-70" x2="-64" y2="70"/>
      <line x1="-48" y1="-70" x2="-40" y2="70"/>
      <line x1="-22" y1="-70" x2="-17" y2="70"/>
      <line x1="4" y1="-70" x2="6" y2="70"/>
      <line x1="30" y1="-70" x2="29" y2="70"/>
      <line x1="56" y1="-70" x2="52" y2="70"/>
      <line x1="82" y1="-70" x2="76" y2="70"/>
      <line x1="104" y1="-70" x2="96" y2="70"/>
    </g>
    <!-- top rubber flange + neck -->
    <ellipse cx="0" cy="-74" rx="118" ry="24" fill="#F0808E" stroke="#9B2A3B" stroke-width="4"/>
    <ellipse cx="0" cy="-74" rx="66" ry="14" fill="#2B3444" stroke="#161C28" stroke-width="3"/>
    <path d="M-66 -74 v-42 a10 10 0 0 1 10 -10 h112 a10 10 0 0 1 10 10 v42" fill="url(#dark)" stroke="#161C28" stroke-width="3"/>
    <ellipse cx="0" cy="-126" rx="66" ry="14" fill="#4A5568" stroke="#161C28" stroke-width="3"/>
    <!-- clamp -->
    <rect x="-70" y="-112" width="140" height="14" rx="4" fill="url(#steel)" stroke="#7C8AA0" stroke-width="2"/>
    <!-- base cap -->
    <ellipse cx="0" cy="74" rx="88" ry="20" fill="#B93E4E" stroke="#7E1E2C" stroke-width="4"/>
    <ellipse cx="0" cy="70" rx="60" ry="13" fill="#D25467" opacity="0.7"/>
  </g>

