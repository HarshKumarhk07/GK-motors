<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2F8"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EDF5"/><stop offset="50%" stop-color="#C3CEDE"/><stop offset="100%" stop-color="#9AA9BF"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B4A9B"/><stop offset="100%" stop-color="#16255A"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E04A45"/><stop offset="100%" stop-color="#A81E1E"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C445"/><stop offset="100%" stop-color="#D68A16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFF1FB"/><stop offset="100%" stop-color="#A8CFE8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5568"/><stop offset="100%" stop-color="#232B3A"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <ellipse cx="300" cy="392" rx="152" ry="19" fill="#0F172A" opacity="0.10"/>
  
  <g transform="translate(300 232) scale(1.34)">
    <!-- glow behind glass -->
    <circle cx="0" cy="-84" r="62" fill="#FDE68A" opacity="0.38"/>
    <!-- glass envelope -->
    <path d="M-40 -152 h80 v104 a40 40 0 0 1 -80 0 z" fill="url(#glass)" stroke="#6F9BB8" stroke-width="4"/>
    <!-- black tip coating -->
    <path d="M-40 -152 h80 v30 a40 12 0 0 1 -80 0 z" fill="#1E293B"/>
    <!-- filament coils -->
    <g fill="none" stroke="#C2861B" stroke-width="5" stroke-linecap="round">
      <path d="M-17 -104 l8 -15 8 15 8 -15 8 15"/>
      <path d="M-17 -76 l8 -15 8 15 8 -15 8 15"/>
    </g>
    <line x1="-17" y1="-104" x2="-17" y2="-58" stroke="#8E9BB0" stroke-width="4"/>
    <line x1="23" y1="-104" x2="23" y2="-58" stroke="#8E9BB0" stroke-width="4"/>
    <!-- highlight on glass -->
    <path d="M-28 -112 q-6 40 6 60" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
    <!-- metal collar -->
    <rect x="-52" y="-52" width="104" height="28" rx="7" fill="url(#steel)" stroke="#7C8AA0" stroke-width="3"/>
    <!-- locating flange with tabs -->
    <rect x="-86" y="-26" width="172" height="24" rx="6" fill="#D5DEEA" stroke="#7C8AA0" stroke-width="3"/>
    <rect x="-86" y="-26" width="24" height="24" rx="6" fill="#AEBBCD" stroke="#7C8AA0" stroke-width="3"/>
    <rect x="62" y="-26" width="24" height="24" rx="6" fill="#AEBBCD" stroke="#7C8AA0" stroke-width="3"/>
    <!-- plastic connector base -->
    <path d="M-46 -2 h92 v46 a10 10 0 0 1 -10 10 h-72 a10 10 0 0 1 -10 -10 z" fill="url(#dark)" stroke="#161C28" stroke-width="3"/>
    <rect x="-34" y="54" width="68" height="18" rx="5" fill="#111827"/>
    <!-- blade terminals -->
    <rect x="-26" y="72" width="13" height="34" rx="3" fill="url(#steel)" stroke="#7C8AA0" stroke-width="2"/>
    <rect x="13" y="72" width="13" height="34" rx="3" fill="url(#steel)" stroke="#7C8AA0" stroke-width="2"/>
  </g>

</svg>
